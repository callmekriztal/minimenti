services:
  - type: web
    name: minimenti-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: minimenti-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "[]"
    healthCheckPath: /health

databases:
  - name: minimenti-db
    plan: free
    region: oregon
    databaseName: minimenti
    user: minimenti
