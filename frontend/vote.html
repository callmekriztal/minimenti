<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote - Mini Mentimeter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8">
    
    <!-- Loading State -->
    <div id="loading" class="text-center py-8">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent mb-3"></div>
      <p class="text-sm text-slate-500">Loading poll...</p>
    </div>

    <!-- Error State -->
    <div id="error-card" class="hidden text-center py-6">
      <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-xl">!</div>
      <h2 class="text-lg font-bold text-slate-900 mb-1">Poll Not Found</h2>
      <p id="error-message" class="text-xs text-slate-500 mb-4">The poll link may be invalid or expired.</p>
      <a href="/" class="inline-block px-4 py-2 bg-slate-800 text-white text-xs font-semibold rounded-xl">Create a Poll</a>
    </div>

    <!-- Voting View -->
    <div id="voting-card" class="hidden space-y-6">
      <div>
        <span class="inline-block px-2.5 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-lg uppercase tracking-wider mb-2">Live Poll</span>
        <h1 id="poll-question" class="text-xl sm:text-2xl font-extrabold text-slate-900 leading-snug"></h1>
      </div>

      <!-- Closed Banner -->
      <div id="closed-banner" class="hidden p-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl text-xs font-medium text-center">
        Voting has ended for this poll.
      </div>

      <!-- Voted Banner -->
      <div id="voted-banner" class="hidden p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-center">
        <div class="font-bold text-sm mb-0.5">Vote Cast!</div>
        <p class="text-xs text-emerald-700">Watch the presenter's screen to see the live results.</p>
      </div>

      <!-- Options List -->
      <div id="options-list" class="space-y-3"></div>

      <div id="action-error" class="hidden p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs font-medium text-center"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pollId = params.get('poll_id');

    const loading = document.getElementById('loading');
    const errorCard = document.getElementById('error-card');
    const errorMessage = document.getElementById('error-message');
    const votingCard = document.getElementById('voting-card');
    const pollQuestion = document.getElementById('poll-question');
    const optionsList = document.getElementById('options-list');
    const closedBanner = document.getElementById('closed-banner');
    const votedBanner = document.getElementById('voted-banner');
    const actionError = document.getElementById('action-error');

    // Decision 1: Persistent browser token
    function getVoterToken() {
      let token = localStorage.getItem('minimenti_voter_token');
      if (!token) {
        token = crypto.randomUUID();
        localStorage.setItem('minimenti_voter_token', token);
      }
      return token;
    }

    async function loadPoll() {
      if (!pollId) {
        loading.classList.add('hidden');
        errorMessage.textContent = 'Missing poll_id in link.';
        errorCard.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch(`/polls/${pollId}`);
        if (!res.ok) throw new Error('Poll not found');
        const poll = await res.json();

        loading.classList.add('hidden');
        votingCard.classList.remove('hidden');
        pollQuestion.textContent = poll.question;

        const hasVoted = localStorage.getItem(`voted_${pollId}`) === 'true';
        if (hasVoted) {
          votedBanner.classList.remove('hidden');
        }

        if (poll.is_closed) {
          closedBanner.classList.remove('hidden');
        }

        renderOptions(poll.options, poll.is_closed || hasVoted);
      } catch (err) {
        loading.classList.add('hidden');
        errorMessage.textContent = err.message;
        errorCard.classList.remove('hidden');
      }
    }

    function renderOptions(options, disabled) {
      optionsList.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.disabled = disabled;
        btn.className = `w-full text-left p-4 rounded-xl border text-sm font-semibold transition flex items-center justify-between ${
          disabled
            ? 'bg-slate-50 border-slate-200 text-slate-400 cursor-not-allowed'
            : 'bg-white border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/40 text-slate-800 shadow-sm'
        }`;
        btn.innerHTML = `
          <span>${opt.text}</span>
          <span class="text-xs text-slate-400 font-mono">#${opt.position + 1}</span>
        `;
        if (!disabled) {
          btn.addEventListener('click', () => submitVote(opt.id, btn));
        }
        optionsList.appendChild(btn);
      });
    }

    async function submitVote(optionId, buttonElement) {
      actionError.classList.add('hidden');
      const voterToken = getVoterToken();

      buttonElement.classList.add('ring-2', 'ring-indigo-600', 'bg-indigo-50');

      try {
        const res = await fetch(`/polls/${pollId}/votes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            option_id: optionId,
            voter_token: voterToken
          })
        });

        if (res.status === 409) {
          localStorage.setItem(`voted_${pollId}`, 'true');
          votedBanner.classList.remove('hidden');
          disableAllButtons();
          throw new Error('You have already voted in this poll.');
        }

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.detail || 'Failed to submit vote');
        }

        // Successfully voted!
        localStorage.setItem(`voted_${pollId}`, 'true');
        votedBanner.classList.remove('hidden');
        disableAllButtons();
      } catch (err) {
        actionError.textContent = err.message;
        actionError.classList.remove('hidden');
      }
    }

    function disableAllButtons() {
      Array.from(optionsList.children).forEach(btn => {
        btn.disabled = true;
        btn.className = 'w-full text-left p-4 rounded-xl border text-sm font-semibold bg-slate-50 border-slate-200 text-slate-400 cursor-not-allowed flex items-center justify-between';
      });
    }

    loadPoll();
  </script>
</body>
</html>
