<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Mentimeter - Create a Poll</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-xl bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 text-white font-bold text-2xl mb-3 shadow-md">
        M
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Create a Live Poll</h1>
      <p class="text-slate-500 text-sm mt-1">Interactive presentations & voting in seconds</p>
    </div>

    <!-- Create Form -->
    <form id="poll-form" class="space-y-6">
      <div>
        <label for="question" class="block text-sm font-semibold text-slate-700 mb-1.5">Poll Question</label>
        <input 
          type="text" 
          id="question" 
          required 
          placeholder="e.g. What is your primary programming language?" 
          class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-slate-800 transition"
        />
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="block text-sm font-semibold text-slate-700">Options (2 to 10)</label>
          <span id="option-counter" class="text-xs text-slate-400 font-medium">2 options</span>
        </div>
        <div id="options-container" class="space-y-2.5">
          <div class="flex items-center gap-2">
            <input 
              type="text" 
              required 
              placeholder="Option 1" 
              class="option-input flex-1 px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 text-sm"
            />
          </div>
          <div class="flex items-center gap-2">
            <input 
              type="text" 
              required 
              placeholder="Option 2" 
              class="option-input flex-1 px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 text-sm"
            />
          </div>
        </div>

        <button 
          type="button" 
          id="add-option-btn" 
          class="mt-3 text-xs font-semibold text-indigo-600 hover:text-indigo-700 inline-flex items-center gap-1 transition"
        >
          <span class="text-base font-bold">+</span> Add another option
        </button>
      </div>

      <div id="error-box" class="hidden p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs font-medium"></div>

      <button 
        type="submit" 
        id="submit-btn" 
        class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-200 transition duration-150 flex items-center justify-center gap-2"
      >
        <span>Launch Poll</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>
    </form>

    <!-- Success Modal/Card -->
    <div id="success-view" class="hidden space-y-6">
      <div class="p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-center">
        <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-2 font-bold text-lg">✓</div>
        <h2 class="text-lg font-bold text-emerald-900">Poll is Live!</h2>
        <p class="text-xs text-emerald-700 mt-0.5">Share the links below with your audience and projector.</p>
      </div>

      <div class="space-y-4">
        <!-- Participant Voting Link -->
        <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl">
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Voter Link (For Audience)</label>
          <div class="flex items-center gap-2">
            <input type="text" id="voter-link" readonly class="flex-1 bg-white border border-slate-300 text-xs px-3 py-2 rounded-lg text-slate-700 select-all" />
            <button type="button" id="copy-voter-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-lg transition">Copy</button>
          </div>
        </div>

        <!-- Presenter Projector Link -->
        <div class="p-4 bg-indigo-50 border border-indigo-100 rounded-xl">
          <label class="block text-xs font-bold text-indigo-700 uppercase tracking-wider mb-1">Presenter Screen (For Projector / Slides)</label>
          <div class="flex items-center gap-2">
            <input type="text" id="presenter-link" readonly class="flex-1 bg-white border border-indigo-200 text-xs px-3 py-2 rounded-lg text-indigo-900 select-all" />
            <a id="open-presenter-btn" href="#" target="_blank" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg transition flex items-center gap-1">Open ↗</a>
          </div>
        </div>

        <!-- Secret Admin Key Notice -->
        <div class="text-xs text-slate-400 text-center">
          Admin Key stored locally: <span id="admin-key-text" class="font-mono text-slate-600"></span>
        </div>
      </div>

      <button 
        type="button" 
        onclick="location.reload()" 
        class="w-full py-2.5 text-center text-xs font-semibold text-slate-600 hover:text-slate-900 transition"
      >
        ← Create another poll
      </button>
    </div>
  </div>

  <script>
    const form = document.getElementById('poll-form');
    const optionsContainer = document.getElementById('options-container');
    const addOptionBtn = document.getElementById('add-option-btn');
    const optionCounter = document.getElementById('option-counter');
    const errorBox = document.getElementById('error-box');
    const successView = document.getElementById('success-view');

    function updateOptionCount() {
      const count = optionsContainer.children.length;
      optionCounter.textContent = `${count} options`;
      addOptionBtn.style.display = count >= 10 ? 'none' : 'inline-flex';
    }

    addOptionBtn.addEventListener('click', () => {
      const count = optionsContainer.children.length;
      if (count >= 10) return;

      const div = document.createElement('div');
      div.className = 'flex items-center gap-2';
      div.innerHTML = `
        <input 
          type="text" 
          required 
          placeholder="Option ${count + 1}" 
          class="option-input flex-1 px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 text-sm"
        />
        <button type="button" class="remove-btn text-slate-400 hover:text-rose-600 p-2 text-sm font-bold transition">×</button>
      `;
      div.querySelector('.remove-btn').addEventListener('click', () => {
        if (optionsContainer.children.length > 2) {
          div.remove();
          updateOptionCount();
        }
      });
      optionsContainer.appendChild(div);
      updateOptionCount();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');

      const question = document.getElementById('question').value.trim();
      const options = Array.from(document.querySelectorAll('.option-input'))
        .map(input => input.value.trim())
        .filter(text => text.length > 0);

      if (options.length < 2) {
        errorBox.textContent = 'Please provide at least 2 non-empty options.';
        errorBox.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch('/polls', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, options })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail ? JSON.stringify(err.detail) : 'Failed to create poll');
        }

        const data = await res.json();
        
        // Save admin key in localStorage
        localStorage.setItem(`admin_key_${data.id}`, data.admin_key);

        const origin = window.location.origin;
        const voterUrl = `${origin}/vote.html?poll_id=${data.id}`;
        const presenterUrl = `${origin}/present.html?poll_id=${data.id}&admin_key=${data.admin_key}`;

        document.getElementById('voter-link').value = voterUrl;
        document.getElementById('presenter-link').value = presenterUrl;
        document.getElementById('open-presenter-btn').href = presenterUrl;
        document.getElementById('admin-key-text').textContent = data.admin_key;

        form.classList.add('hidden');
        successView.classList.remove('hidden');
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
      }
    });

    document.getElementById('copy-voter-btn').addEventListener('click', () => {
      const input = document.getElementById('voter-link');
      navigator.clipboard.writeText(input.value);
      const btn = document.getElementById('copy-voter-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 2000);
    });

    updateOptionCount();
  </script>
</body>
</html>
